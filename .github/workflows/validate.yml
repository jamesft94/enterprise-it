name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive Terraform
      - name: Initialize without a backend
        run: terraform -chdir=Terraform init -backend=false
      - name: Validate configuration
        run: terraform -chdir=Terraform validate

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ansible and required collections
        run: |
          python -m pip install ansible-core
          ansible-galaxy collection install community.general freeipa.ansible_freeipa
      - name: Check playbook syntax
        run: |
          for playbook in Ansible/*.yml; do
            ansible-playbook --syntax-check -i localhost, "$playbook"
          done
      - name: Check shell script syntax
        run: bash -n Ansible/compliance-discovery.sh
