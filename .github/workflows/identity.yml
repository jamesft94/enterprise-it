name: identity

# Pull request -> checks + terraform plan (nothing changes)
# Merge to main -> terraform apply, after a reviewer approves in the
#                  "entra-production" environment
#
# Plan and apply only run once the repo variable ENTRA_ENABLED is "true".
# Until then this is checks only: safe to run in public.
# Before enabling, turn on the azurerm backend in identity/versions.tf so state is kept
# between runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # sign in to Entra with OIDC, no stored secret

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_domain: ${{ vars.ENTRA_DOMAIN }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: identity

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Tests (mocked provider, no tenant needed)
        run: terraform test
      - name: Lint PowerShell
        shell: pwsh
        working-directory: scripts
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse -EnableExit

  plan:
    needs: checks
    if: github.event_name == 'pull_request' && vars.ENTRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan
      - name: Show the plan to the reviewer
        run: |
          {
            echo '### Terraform plan: identity'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: checks
    if: github.event_name == 'push' && vars.ENTRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: entra-production   # waits here for a human to approve
    concurrency: identity-apply
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve -no-color
