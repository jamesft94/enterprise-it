---
# ============================================================================
# SENSIO ENTERPRISE IT BLUEPRINT: Entra ID -> FreeIPA Lifecycle Bridge
# Purpose: Ensure Entra ID remains the single source of truth for JML
#          (Joiner/Mover/Leaver) while R&D retains native FreeIPA/Linux access.
# ISO 27001 Control: A.5.18 (Access Rights - Provisioning & Revocation)
# ============================================================================
- name: Synchronize Identity Lifecycle from Entra ID to FreeIPA
  hosts: localhost
  gather_facts: false
  vars:
    freeipa_server: "ipa.internal.sensio.example"
    # In production, fetched dynamically via Microsoft Graph API query
    entra_rnd_users:
      - username: "ola.nordmann"
        givenname: "Ola"
        sn: "Nordmann"
        mail: "ola.nordmann@sensio.example"
        account_enabled: true
        sshpubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyForOla..."
      - username: "former.engineer"
        givenname: "Former"
        sn: "Engineer"
        mail: "former.engineer@sensio.example"
        account_enabled: false # Offboarded in Entra ID -> Must auto-disable in FreeIPA

  tasks:
    - name: "PROVISION / UPDATE: Ensure active Entra R&D users exist in FreeIPA with SSH keys"
      community.general.ipa_user:
        ipa_host: "{{ freeipa_server }}"
        name: "{{ item.username }}"
        givenname: "{{ item.givenname }}"
        sn: "{{ item.sn }}"
        mail: "{{ item.mail }}"
        sshpubkey:
          - "{{ item.sshpubkey }}"
        state: present
      loop: "{{ entra_rnd_users | selectattr('account_enabled', 'equalto', true) | list }}"
      loop_control:
        label: "{{ item.username }} (Active)"

    - name: "REVOKE (LEAVER): Immediately disable FreeIPA accounts disabled in Entra ID"
      community.general.ipa_user:
        ipa_host: "{{ freeipa_server }}"
        name: "{{ item.username }}"
        state: disabled
      loop: "{{ entra_rnd_users | selectattr('account_enabled', 'equalto', false) | list }}"
      loop_control:
        label: "{{ item.username }} (Offboarded -> Disabled)"
